<!doctype html><meta charset="utf-8"><title>Malayalam Studio – Settings</title><style>
*{box-sizing:border-box}body{margin:0;font:14px 'Segoe UI',sans-serif;background:#f3f5f9;color:#1b2433}
header{background:#2b579a;color:#fff;padding:16px 22px}header h1{font-size:18px;margin:0}header p{margin:3px 0 0;font-size:12px;opacity:.85}
main{padding:16px 22px 22px;display:grid;gap:14px}
section{background:#fff;border:1px solid #dde3ee;border-radius:10px;padding:12px 16px}section h2{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:#6b7a90;margin:0 0 8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}.row small{display:block;color:#6b7a90;font-size:12px;margin-top:1px}
select,input[type=text]{font:inherit;padding:5px 8px;border:1px solid #c5cedd;border-radius:6px;background:#fff;min-width:210px}
input[type=checkbox]{width:18px;height:18px;accent-color:#2b579a}
button{font:inherit;padding:6px 14px;border:0;border-radius:6px;background:#2b579a;color:#fff;cursor:pointer}button.g{background:#e6ebf3;color:#1b2433}
#msg{font-size:12px;color:#1d6f42;min-height:16px}
</style><header><h1>Malayalam Studio – Settings</h1><p>Changes are saved automatically.</p></header><main id="m"></main>
<script>
const {ipcRenderer}=require('electron');
(async()=>{
const S=await ipcRenderer.invoke('settings:get');
const sel=(id,o)=>'<select data-k="'+id+'">'+Object.entries(o).map(([v,l])=>'<option value="'+v+'"'+(S.cfg[id]===v?' selected':'')+'>'+l+'</option>').join('')+'</select>';
const chk=(id)=>'<input type="checkbox" data-k="'+id+'"'+(S.cfg[id]?' checked':'')+'>';
const row=(t,s,c)=>'<div class="row"><div>'+t+(s?'<small>'+s+'</small>':'')+'</div>'+c+'</div>';
const keys=Object.fromEntries(S.keys.map(k=>[k,k]));
document.getElementById('m').innerHTML=
'<section><h2>Typing anywhere</h2>'+
row('Malayalam typing','Same as pressing the On/Off key',chk('enabled'))+
row('Keyboard layout','',sel('layout',S.layouts))+
row('Font type (output)','Unicode works everywhere; ML-TT / MLW-TT for legacy fonts',sel('output',S.outputs))+
row('On/Off key','',sel('toggleKey',keys))+
row('Next-layout key','',sel('nextLayoutKey',keys))+
row('Keep keyboard light in step','Scroll Lock light shows ON/OFF',chk('syncLed'))+'</section>'+
'<section><h2>Manglish</h2>'+
row('Suggestion pop-up','Shows Malayalam words next to the cursor while you type English letters',chk('suggest'))+
row('Online suggestions','Adds Google Input Tools words when internet is available',chk('online'))+'</section>'+
'<section><h2>App</h2>'+
row('Show on-screen message when switching','',chk('osd'))+
row('Start with Windows','',chk('startup'))+
row('Keep running in the tray when the window is closed','',chk('keepInTray'))+
row('Malayalam fonts','Installs the Unicode + ML-TT / MLW-TT fonts for Word and other programs','<button id="fonts">Install / repair fonts</button>')+'</section>'+
'<section><h2>Updates from the web version</h2>'+
row('Web app address','Paste your Malayalam Studio web address (https://…). The desktop app then picks up the changes you publish.','<input type="text" data-k="webUrl" placeholder="https://your-app.vercel.app" value="'+(S.cfg.webUrl||'')+'">')+
row('','<span id="msg"></span>','<button class="g" id="upd">Check for updates now</button>')+'</section>';
document.querySelectorAll('[data-k]').forEach(e=>e.addEventListener('change',()=>ipcRenderer.invoke('settings:set',{[e.dataset.k]:e.type==='checkbox'?e.checked:e.value.trim()})));
document.getElementById('fonts').onclick=async()=>{document.getElementById('msg').textContent='Installing fonts…';document.getElementById('msg').textContent=await ipcRenderer.invoke('fonts:install')};
document.getElementById('upd').onclick=async()=>{document.getElementById('msg').textContent='Checking…';document.getElementById('msg').textContent=await ipcRenderer.invoke('update:check')};
})();
</script>
